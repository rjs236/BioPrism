<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="dnaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Subtle Hexagon / Prism Shield -->
  <polygon points="50,6 88,26 88,74 50,94 12,74 12,26" fill="none" stroke="url(#prismGrad)" stroke-width="2.5" stroke-linejoin="round" opacity="0.85" />
  
  <!-- Central Molecular Network Links -->
  <line x1="50" y1="22" x2="32" y2="44" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="2,2" opacity="0.7" />
  <line x1="50" y1="22" x2="68" y2="44" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="2,2" opacity="0.7" />
  <line x1="32" y1="44" x2="68" y2="44" stroke="#0d9488" stroke-width="2" opacity="0.8" />
  <line x1="32" y1="44" x2="40" y2="68" stroke="#94a3b8" stroke-width="1.8" opacity="0.7" />
  <line x1="68" y1="44" x2="60" y2="68" stroke="#94a3b8" stroke-width="1.8" opacity="0.7" />
  <line x1="40" y1="68" x2="60" y2="68" stroke="#3b82f6" stroke-width="2" opacity="0.8" />
  <line x1="50" y1="22" x2="50" y2="78" stroke="url(#dnaGrad)" stroke-width="2.2" opacity="0.85" />

  <!-- DNA Helix Waves Across Center -->
  <path d="M 24,35 Q 50,50 76,35" fill="none" stroke="#06b6d4" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 24,65 Q 50,50 76,65" fill="none" stroke="#0d9488" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="36" cy="42" r="2" fill="#3b82f6" />
  <circle cx="64" cy="42" r="2" fill="#06b6d4" />
  <circle cx="36" cy="58" r="2" fill="#0d9488" />
  <circle cx="64" cy="58" r="2" fill="#14b8a6" />

  <!-- Network Nodes / Biomarker Hubs -->
  <circle cx="50" cy="22" r="6" fill="#06b6d4" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
  <circle cx="32" cy="44" r="5" fill="#0d9488" stroke="#ffffff" stroke-width="1.8" />
  <circle cx="68" cy="44" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.8" />
  <circle cx="40" cy="68" r="5.5" fill="#0f766e" stroke="#ffffff" stroke-width="1.8" />
  <circle cx="60" cy="68" r="5.5" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.8" />
  <circle cx="50" cy="78" r="4.5" fill="#0284c7" stroke="#ffffff" stroke-width="1.8" />

  <!-- Central Focus Node (The Biomarker Prism Core) -->
  <circle cx="50" cy="50" r="7.5" fill="url(#prismGrad)" stroke="#ffffff" stroke-width="2.5" filter="url(#glow)" />
  <circle cx="50" cy="50" r="3" fill="#ffffff" />
</svg>
